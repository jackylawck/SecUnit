<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>秒換 SecUnit - 終極萬能轉換器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .tab-active { background-color: #2563eb !important; color: #ffffff !important; font-weight: 700; }
    .flash-update { animation: flashCyan 0.6s ease-out; }
    @keyframes flashCyan {
      0% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.7); border-color: #06b6d4; }
      70% { box-shadow: 0 0 0 6px rgba(6, 182, 212, 0); border-color: #3b82f6; }
      100% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); border-color: #334155; }
    }
    /* 自訂捲軸讓 80 個時區選單更好滑 */
    select::-webkit-scrollbar { width: 8px; }
    select::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6">

  <!-- Main Container -->
  <main class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-2xl my-auto">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-5">
      <div>
        <h1 class="text-2xl font-black bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-500 bg-clip-text text-transparent">
          秒換 SecUnit
        </h1>
        <p id="t-subtitle" class="text-xs text-slate-400 mt-0.5">無廣告 · 零存儲 · 多重即時 API 支持</p>
      </div>
      <button onclick="toggleLanguage()" class="text-xs font-mono bg-slate-700 hover:bg-slate-600 text-cyan-300 border border-cyan-500/30 px-3 py-1 rounded-full transition active:scale-95">
        🌐 <span id="langBtnText">EN</span>
      </button>
    </div>

    <!-- Navigation Tabs (擴充至 19 個分類，加入時區) -->
    <div class="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-5 gap-1.5 mb-5 bg-slate-900/50 p-1.5 rounded-2xl border border-slate-700/50 text-center">
      <button onclick="switchTab('weight')" id="tab-weight" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition tab-active"></button>
      <button onclick="switchTab('fx')" id="tab-fx" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('timezone')" id="tab-timezone" class="tab-btn py-2 text-xs font-medium rounded-xl text-amber-300 hover:text-amber-100 bg-amber-900/20 border border-amber-700/30 transition"></button>
      <button onclick="switchTab('gold')" id="tab-gold" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('baking')" id="tab-baking" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      
      <button onclick="switchTab('length')" id="tab-length" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('area')" id="tab-area" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('volume')" id="tab-volume" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('temp')" id="tab-temp" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('speed')" id="tab-speed" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      
      <button onclick="switchTab('time')" id="tab-time" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('data')" id="tab-data" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('energy')" id="tab-energy" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('pressure')" id="tab-pressure" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('power')" id="tab-power" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      
      <button onclick="switchTab('fuel')" id="tab-fuel" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('angle')" id="tab-angle" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('force')" id="tab-force" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('torque')" id="tab-torque" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
    </div>

    <!-- Conversion Form -->
    <div class="space-y-4">
      <div>
        <label id="t-inputLabel" class="block text-xs font-medium text-slate-400 mb-1">輸入數值 (例如時間輸入 14 代表 14:00)</label>
        <input type="number" id="inputValue" value="1" step="any" inputmode="decimal" oninput="convert()" 
               class="w-full bg-slate-900 border border-slate-700 focus:border-blue-500 rounded-xl px-4 py-3 text-2xl font-mono font-bold text-white focus:outline-none transition">
      </div>

      <!-- Toggle Advanced Units -->
      <div class="flex justify-end">
        <button onclick="toggleRareUnits()" id="rareToggleBtn" class="text-xs font-medium text-slate-400 hover:text-cyan-400 transition flex items-center gap-1 bg-slate-800 border border-slate-600 px-3 py-1.5 rounded-lg active:scale-95">
          <span id="rareToggleIcon">👀</span> <span id="t-rareToggle">顯示罕見/進階單位</span>
        </button>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label id="t-fromLabel" class="block text-xs font-medium text-slate-400 mb-1">由 (From)</label>
          <select id="fromUnit" onchange="convert()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-200 focus:outline-none transition"></select>
        </div>
        <div>
          <label id="t-toLabel" class="block text-xs font-medium text-slate-400 mb-1">轉至 (To)</label>
          <select id="toUnit" onchange="convert()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-200 focus:outline-none transition"></select>
        </div>
      </div>

      <!-- Result Card -->
      <div class="bg-gradient-to-br from-slate-900 to-slate-900/80 border border-slate-700/80 rounded-2xl p-5 mt-6 text-center relative group">
        <div id="t-resultLabel" class="text-xs text-slate-400 font-medium mb-1">轉換結果</div>
        <div id="result" class="text-3xl sm:text-4xl font-extrabold font-mono text-cyan-400 tracking-tight break-all">---</div>
        <div id="extraInfo" class="text-xs text-slate-400 mt-2 font-light min-h-[2.5rem] flex flex-col justify-center gap-1"></div>

        <button onclick="copyResult()" class="mt-3 inline-flex items-center gap-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 px-3 py-1 rounded-lg transition active:scale-95">
          <span id="copyBtnText">📋 複製結果</span>
        </button>
      </div>
    </div>
  </main>

    window.toggleLanguage = function() {
      lang = lang === 'zh' ? 'en' : 'zh';
      document.getElementById('langBtnText').innerText = lang === 'zh' ? 'EN' : '中文';
      updateUIStrings();
      populateSelects();
      convert();
    };

    window.toggleRareUnits = function() {
      showRare = !showRare;
      const t = i18n[lang];
      document.getElementById('t-rareToggle').innerText = showRare ? t.rareOn : t.rareOff;
      document.getElementById('rareToggleIcon').innerText = showRare ? '🙈' : '👀';
      
      const fromEl = document.getElementById('fromUnit');
      const toEl = document.getElementById('toUnit');
      const oldFrom = fromEl.value;
      const oldTo = toEl.value;
      
      populateSelects();

      if (Array.from(fromEl.options).some(opt => opt.value === oldFrom)) fromEl.value = oldFrom;
      if (Array.from(toEl.options).some(opt => opt.value === oldTo)) toEl.value = oldTo;
      
      fromEl.classList.remove('flash-update');
      toEl.classList.remove('flash-update');
      void fromEl.offsetWidth;
      fromEl.classList.add('flash-update');
      toEl.classList.add('flash-update');
      convert();
    };

    window.switchTab = function(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('tab-active'));
      document.getElementById(`tab-${tab}`).classList.add('tab-active');
      document.getElementById('bakingSelectorGroup').className = tab === 'baking' ? 'block' : 'hidden';
      populateSelects();
      convert();
    };

    function updateUIStrings() {
      const t = i18n[lang];
      document.getElementById('t-subtitle').innerText = t.subtitle;
      document.getElementById('t-inputLabel').innerText = t.inputLabel;
      document.getElementById('t-fromLabel').innerText = t.fromLabel;
      document.getElementById('t-toLabel').innerText = t.toLabel;
      document.getElementById('t-resultLabel').innerText = t.resultLabel;
      document.getElementById('copyBtnText').innerText = t.copyBtn;
      document.getElementById('t-rareToggle').innerText = showRare ? t.rareOn : t.rareOff;

      Object.keys(t.tabs).forEach(key => {
        const el = document.getElementById(`tab-${key}`);
        if(el) el.innerText = t.tabs[key];
      });
    }

    function populateSelects() {
      const fromSelect = document.getElementById('fromUnit');
      const toSelect = document.getElementById('toUnit');
      fromSelect.innerHTML = '';
      toSelect.innerHTML = '';

      const currentUnits = units[currentTab];
      Object.keys(currentUnits).forEach(key => {
        if (currentUnits[key].rare && !showRare) return;
        const label = currentUnits[key][lang];
        fromSelect.add(new Option(label, key));
        toSelect.add(new Option(label, key));
      });
      if (fromSelect.options.length > 1) toSelect.selectedIndex = 1;
    }

    window.convert = async function() {
      const val = parseFloat(document.getElementById('inputValue').value);
      const from = document.getElementById('fromUnit').value;
      const to = document.getElementById('toUnit').value;
      const extraInfo = document.getElementById('extraInfo');
      const resultEl = document.getElementById('result');

      if (isNaN(val) || !from || !to) {
        resultEl.innerText = '---';
        extraInfo.innerText = '';
        return;
      }

      let res = 0;
      extraInfo.innerHTML = '';

      if (currentTab === 'fx') {
        const hkdBase = from === 'HKD' ? val : val / (globalRates[from] || 1);
        res = to === 'HKD' ? hkdBase : hkdBase * (globalRates[to] || 1);
        extraInfo.innerHTML = lang === 'zh' ? '💡 數據由 Frankfurter & CoinGecko 提供' : '💡 Data via Frankfurter & CoinGecko';
        
        // 觸發 REST Countries API
        if (!countryCache[to]) {
           const cInfo = await fetchCountryInfo(to);
           if (cInfo) countryCache[to] = cInfo;
        }
        if (countryCache[to]) {
           const c = countryCache[to];
           extraInfo.innerHTML += `<br>🌍 國家/地區: ${c.flag} ${c.name} | 首都: ${c.capital} | 人口: ${c.pop}`;
        }
      }
      else if (currentTab === 'timezone') {
        const baseVal = units[currentTab][from].toBase(val);
        res = units[currentTab][to].fromBase(baseVal);
        
        // 格式化顯示 24 小時時間 (e.g. 14.5 -> 14:30)
        let hrs = Math.floor(res);
        let mins = Math.round((res - hrs) * 60);
        if (mins === 60) { hrs = (hrs + 1) % 24; mins = 0; }
        const timeStr = `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
        resultEl.innerText = timeStr;
        
        // 觸發 WorldTime API 獲取真實時間
        extraInfo.innerHTML = `<span class="text-cyan-400 animate-pulse">連線中... Fetching Live Time...</span>`;
        const liveTime = await fetchWorldTime(to);
        if (liveTime) {
            const formatted = liveTime.substring(0, 19).replace('T', ' ');
            extraInfo.innerHTML = `📡 系統即時同步 System Live Time:<br><strong class="text-white">${formatted}</strong>`;
        } else {
            extraInfo.innerHTML = `📡 無法獲取即時系統時間 API Offline`;
        }
        return; // 時區自行接管了 resultEl 的渲染
      }
      else if (currentTab === 'gold') {
        const usdToHkdRate = globalRates['USD'] ? (1 / globalRates['USD']) : 7.82;
        const taelPerOz = 0.8294;
        if (from === 'oz_t' && to === 'tael_hk') res = (val * liveGoldUsdOz * usdToHkdRate) / taelPerOz;
        else if (from === 'tael_hk' && to === 'oz_t') res = (val * taelPerOz) / (liveGoldUsdOz * usdToHkdRate);
        else res = val;
        extraInfo.innerText = lang === 'zh' ? `💡 國際即時黃金參考價: $${liveGoldUsdOz} USD/oz` : `💡 Live Spot Gold: $${liveGoldUsdOz} USD/oz`;
      }
      else if (currentTab === 'temp' || currentTab === 'pressure') {
        const baseVal = units[currentTab][from].toBase(val);
        res = units[currentTab][to].fromBase(baseVal);
        extraInfo.innerHTML = lang === 'zh' 
          ? `🌡️ 港天文台: ${hkEnvData.temp}°C | 濕度: ${hkEnvData.humidity}%<br>💨 實時空氣質素 (AQI): <strong class="text-amber-400">${hkEnvData.aqi}</strong> | PM2.5: ${hkEnvData.pm25}`
          : `🌡️ HKO: ${hkEnvData.temp}°C | Humidity: ${hkEnvData.humidity}%<br>💨 Live AQI: <strong class="text-amber-400">${hkEnvData.aqi}</strong> | PM2.5: ${hkEnvData.pm25}`;
      }
      else {
        const baseVal = units[currentTab][from].toBase(val);
        res = units[currentTab][to].fromBase(baseVal);
      }

      // 一般渲染
      if (!isFinite(res)) {
        resultEl.innerText = '∞';
      } else {
        if (Math.abs(res) < 0.0001 && res !== 0) resultEl.innerText = res.toExponential(4);
        else if (Math.abs(res) > 1e10) resultEl.innerText = res.toExponential(4);
        else resultEl.innerText = Number.isInteger(res) ? res.toString() : res.toLocaleString(undefined, { maximumFractionDigits: 4 });
      }
    };

    window.copyResult = function() {
      const resText = document.getElementById('result').innerText;
      if (resText === '---') return;
      navigator.clipboard.writeText(resText).then(() => {
        const btnText = document.getElementById('copyBtnText');
        btnText.innerText = i18n[lang].copied;
        setTimeout(() => { btnText.innerText = i18n[lang].copyBtn; }, 2000);
      });
    };

    async function initApp() {
      updateUIStrings();
      populateSelects();
      convert();

      try {
        const loc = await fetchUserLocation();
        document.getElementById('userLocationText').innerText = `📍 Location: ${loc.countryName} (${loc.countryCode})`;

        // 併發獲取基礎 API 數據
        const [rates, hko, gold, crypto, aqi] = await Promise.all([
          fetchGlobalRates('HKD'),
          fetchHKEnvironmentData(),
          fetchGoldPrice(),
          fetchCryptoPrices(),
          fetchAirQuality()
        ]);

        if (rates) globalRates = { 'HKD': 1, ...rates };
        if (crypto && globalRates['USD']) {
           // 將 Crypto 的 USD 價格轉為以 HKD 為基準 (因為 globalRates 以 HKD=1)
           globalRates['BTC'] = 1 / (crypto.btc_usd * (1/globalRates['USD']));
           globalRates['ETH'] = 1 / (crypto.eth_usd * (1/globalRates['USD']));
        }
        
        liveGoldUsdOz = gold;
        hkEnvData = { ...hko, ...aqi };
        convert();
      } catch (err) {
        console.warn('API Load warning, running on defaults.');
      }
    }

    initApp();
  </script>
