<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>秒換 SecUnit - Instant Unit & Data Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .tab-active { background-color: #2563eb !important; color: #ffffff !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6">

  <!-- Main Container -->
  <main class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-2xl my-auto">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-black bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-500 bg-clip-text text-transparent">
          秒換 SecUnit
        </h1>
        <p id="t-subtitle" class="text-xs text-slate-400 mt-0.5">零廣告 · 離線可用 · 香港在地化</p>
      </div>
      
      <!-- Language Toggle Button -->
      <button onclick="toggleLanguage()" class="text-xs font-mono bg-slate-700 hover:bg-slate-600 text-cyan-300 border border-cyan-500/30 px-3 py-1 rounded-full transition active:scale-95">
        🌐 <span id="langBtnText">EN</span>
      </button>
    </div>

    <!-- Navigation Tabs -->
    <div class="grid grid-cols-5 gap-1 mb-6 bg-slate-900/50 p-1.5 rounded-xl border border-slate-700/50">
      <button onclick="switchTab('weight')" id="tab-weight" class="tab-btn py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition tab-active"></button>
      <button onclick="switchTab('length')" id="tab-length" class="tab-btn py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('area')" id="tab-area" class="tab-btn py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('temp')" id="tab-temp" class="tab-btn py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('data')" id="tab-data" class="tab-btn py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition"></button>
    </div>

    <!-- Conversion Form -->
    <div class="space-y-4">
      <div>
        <label id="t-inputLabel" class="block text-xs font-medium text-slate-400 mb-1">輸入數值</label>
        <input type="number" id="inputValue" value="1" step="any" oninput="convert()" 
               class="w-full bg-slate-900 border border-slate-700 focus:border-blue-500 rounded-xl px-4 py-3 text-2xl font-mono font-bold text-white focus:outline-none transition">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label id="t-fromLabel" class="block text-xs font-medium text-slate-400 mb-1">由 (From)</label>
          <select id="fromUnit" onchange="convert()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition"></select>
        </div>
        <div>
          <label id="t-toLabel" class="block text-xs font-medium text-slate-400 mb-1">轉至 (To)</label>
          <select id="toUnit" onchange="convert()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition"></select>
        </div>
      </div>

      <!-- Result Card -->
      <div class="bg-gradient-to-br from-slate-900 to-slate-900/80 border border-slate-700/80 rounded-2xl p-5 mt-6 text-center relative group">
        <div id="t-resultLabel" class="text-xs text-slate-400 font-medium mb-1">轉換結果</div>
        <div id="result" class="text-3xl sm:text-4xl font-extrabold font-mono text-cyan-400 tracking-tight break-all">---</div>
        <div id="extraInfo" class="text-xs text-slate-400 mt-2 font-light min-h-[1rem]"></div>

        <button onclick="copyResult()" class="mt-3 inline-flex items-center gap-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 px-3 py-1 rounded-lg transition active:scale-95">
          <span id="copyBtnText">📋 複製結果</span>
        </button>
      </div>
    </div>
  </main>

  <footer class="mt-6 text-center text-xs text-slate-500 space-y-1">
    <p>SecUnit &copy; 2026 | Pure & Ad-free · HK Context Enabled</p>
  </footer>

  <script>
    let lang = 'zh';
    let currentTab = 'weight';

    const i18n = {
      zh: {
        subtitle: '零廣告 · 離線可用 · 香港在地化',
        inputLabel: '輸入數值',
        fromLabel: '由 (From)',
        toLabel: '轉至 (To)',
        resultLabel: '轉換結果',
        copyBtn: '📋 複製結果',
        copied: '✅ 已複製！',
        tabs: { weight: '重量', length: '長度', area: '面積', temp: '溫度', data: '數據/網速' }
      },
      en: {
        subtitle: 'Ad-free · Offline Ready · HK Localized',
        inputLabel: 'Value',
        fromLabel: 'From',
        toLabel: 'To',
        resultLabel: 'Result',
        copyBtn: '📋 Copy Result',
        copied: '✅ Copied!',
        tabs: { weight: 'Weight', length: 'Length', area: 'Area', temp: 'Temp', data: 'Data/Speed' }
      }
    };

    const units = {
      weight: {
        'lbs': { zh: '磅 (lbs)', en: 'Pounds (lbs)', toBase: x => x * 0.45359237, fromBase: x => x / 0.45359237 },
        'kg': { zh: '公斤 (kg)', en: 'Kilograms (kg)', toBase: x => x, fromBase: x => x },
        'g': { zh: '克 (g)', en: 'Grams (g)', toBase: x => x / 1000, fromBase: x => x * 1000 },
        'oz': { zh: '盎司 (oz)', en: 'Ounces (oz)', toBase: x => x * 0.0283495, fromBase: x => x / 0.0283495 },
        'catty_hk': { zh: '香港斤 (司馬斤)', en: 'HK Catty', toBase: x => x * 0.60478982, fromBase: x => x / 0.60478982 },
        'tael_hk': { zh: '香港兩 (司馬兩)', en: 'HK Tael (Gold)', toBase: x => x * 0.037429, fromBase: x => x / 0.037429 },
        'mace_hk': { zh: '香港錢 (司馬錢)', en: 'HK Mace', toBase: x => x * 0.0037429, fromBase: x => x / 0.0037429 },
        'catty_cn': { zh: '市斤 (大陸斤)', en: 'CN Catty (500g)', toBase: x => x * 0.5, fromBase: x => x / 0.5 }
      },
      length: {
        'm': { zh: '米 / 公尺 (m)', en: 'Meters (m)', toBase: x => x, fromBase: x => x },
        'cm': { zh: '厘米 / 公分 (cm)', en: 'Centimeters (cm)', toBase: x => x / 100, fromBase: x => x * 100 },
        'ft': { zh: '呎 / 英尺 (ft)', en: 'Feet (ft)', toBase: x => x * 0.3048, fromBase: x => x / 0.3048 },
        'in': { zh: '吋 / 吋 (in)', en: 'Inches (in)', toBase: x => x * 0.0254, fromBase: x => x / 0.0254 },
        'km': { zh: '公里 (km)', en: 'Kilometers (km)', toBase: x => x * 1000, fromBase: x => x / 1000 },
        'mile': { zh: '哩 / 英里 (mile)', en: 'Miles', toBase: x => x * 1609.344, fromBase: x => x / 1609.344 }
      },
      area: {
        'sqft': { zh: '平方呎 (sq ft)', en: 'Sq Feet (sq ft)', toBase: x => x * 0.09290304, fromBase: x => x / 0.09290304 },
        'sqm': { zh: '平方米 (sq m)', en: 'Sq Meters (sq m)', toBase: x => x, fromBase: x => x },
        'ping': { zh: '台灣坪', en: 'Taiwan Ping', toBase: x => x * 3.305785, fromBase: x => x / 3.305785 },
        'hectare': { zh: '公頃 (ha)', en: 'Hectares (ha)', toBase: x => x * 10000, fromBase: x => x / 10000 }
      },
      temp: {
        'C': { zh: '攝氏 (°C)', en: 'Celsius (°C)', toBase: x => x, fromBase: x => x },
        'F': { zh: '華氏 (°F)', en: 'Fahrenheit (°F)', toBase: x => (x - 32) * 5/9, fromBase: x => (x * 9/5) + 32 },
        'K': { zh: '開氏度 (K)', en: 'Kelvin (K)', toBase: x => x - 273.15, fromBase: x => x + 273.15 }
      },
      data: {
        'MB': { zh: 'Megabytes (MB)', en: 'Megabytes (MB)', toBase: x => x, fromBase: x => x },
        'GB': { zh: 'Gigabytes (GB)', en: 'Gigabytes (GB)', toBase: x => x * 1024, fromBase: x => x / 1024 },
        'TB': { zh: 'Terabytes (TB)', en: 'Terabytes (TB)', toBase: x => x * 1024 * 1024, fromBase: x => x / (1024 * 1024) },
        'Mbps': { zh: '寬頻網絡 (Mbps)', en: 'Mbps (Network)', toBase: x => x / 8, fromBase: x => x * 8 },
        'MBs': { zh: '實質下載速度 (MB/s)', en: 'MB/s (Download)', toBase: x => x, fromBase: x => x }
      }
    };

    function toggleLanguage() {
      lang = lang === 'zh' ? 'en' : 'zh';
      document.getElementById('langBtnText').innerText = lang === 'zh' ? 'EN' : '中文';
      updateUIStrings();
      populateSelects();
      convert();
    }

    function updateUIStrings() {
      const t = i18n[lang];
      document.getElementById('t-subtitle').innerText = t.subtitle;
      document.getElementById('t-inputLabel').innerText = t.inputLabel;
      document.getElementById('t-fromLabel').innerText = t.fromLabel;
      document.getElementById('t-toLabel').innerText = t.toLabel;
      document.getElementById('t-resultLabel').innerText = t.resultLabel;
      document.getElementById('copyBtnText').innerText = t.copyBtn;

      Object.keys(t.tabs).forEach(key => {
        document.getElementById(`tab-${key}`).innerText = t.tabs[key];
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('tab-active'));
      document.getElementById(`tab-${tab}`).classList.add('tab-active');
      populateSelects();
      convert();
    }

    function populateSelects() {
      const fromSelect = document.getElementById('fromUnit');
      const toSelect = document.getElementById('toUnit');
      fromSelect.innerHTML = '';
      toSelect.innerHTML = '';

      const currentUnits = units[currentTab];
      Object.keys(currentUnits).forEach(key => {
        const label = currentUnits[key][lang];
        fromSelect.add(new Option(label, key));
        toSelect.add(new Option(label, key));
      });

      if (Object.keys(currentUnits).length > 1) {
        toSelect.selectedIndex = 1;
      }
    }

    function convert() {
      const val = parseFloat(document.getElementById('inputValue').value);
      const from = document.getElementById('fromUnit').value;
      const to = document.getElementById('toUnit').value;
      const resultEl = document.getElementById('result');

      if (isNaN(val) || !from || !to) {
        resultEl.innerText = '---';
        return;
      }

      const baseVal = units[currentTab][from].toBase(val);
      const res = units[currentTab][to].fromBase(baseVal);

      resultEl.innerText = Number.isInteger(res) ? res.toString() : res.toLocaleString(undefined, { maximumFractionDigits: 4 });
    }

    function copyResult() {
      const resText = document.getElementById('result').innerText;
      if (resText === '---') return;
      navigator.clipboard.writeText(resText).then(() => {
        const btnText = document.getElementById('copyBtnText');
        btnText.innerText = i18n[lang].copied;
        setTimeout(() => { btnText.innerText = i18n[lang].copyBtn; }, 2000);
      });
    }

    // Init
    updateUIStrings();
    populateSelects();
    convert();
  </script>
</body>
</html>
