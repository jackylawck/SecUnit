  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .tab-active { background-color: #2563eb !important; color: #ffffff !important; font-weight: 700; }
  </style>
</head>

        <p id="t-subtitle" class="text-xs text-slate-400 mt-0.5">無廣告 · 零存儲 · 秒轉換</p>
      </div>
      
      <button onclick="toggleLanguage()" class="text-xs font-mono bg-slate-700 hover:bg-slate-600 text-cyan-300 border border-cyan-500/30 px-3 py-1 rounded-full transition active:scale-95">
        🌐 <span id="langBtnText">EN</span>
      </button>
    </div>

      <button onclick="switchTab('weight')" id="tab-weight" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition tab-active"></button>
      <button onclick="switchTab('fx')" id="tab-fx" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('gold')" id="tab-gold" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('baking')" id="tab-baking" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('length')" id="tab-length" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('area')" id="tab-area" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      
      <button onclick="switchTab('volume')" id="tab-volume" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>

      <button onclick="switchTab('time')" id="tab-time" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('data')" id="tab-data" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('energy')" id="tab-energy" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      
      <button onclick="switchTab('pressure')" id="tab-pressure" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('power')" id="tab-power" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>
      <button onclick="switchTab('fuel')" id="tab-fuel" class="tab-btn py-2 text-xs font-medium rounded-xl text-slate-400 hover:text-slate-200 transition"></button>

    <!-- Conversion Form -->
    <div class="space-y-4">
      <div>
        <label id="t-inputLabel" class="block text-xs font-medium text-slate-400 mb-1">輸入數值</label>
        <input type="number" id="inputValue" value="1" step="any" oninput="convert()" 
               class="w-full bg-slate-900 border border-slate-700 focus:border-blue-500 rounded-xl px-4 py-3 text-2xl font-mono font-bold text-white focus:outline-none transition">
      </div>

      <!-- Baking Selector -->
      <div id="bakingSelectorGroup" class="hidden">
        <label class="block text-xs font-medium text-amber-400 mb-1">選擇食材類型 (食材密度專用)</label>
        <select id="foodType" onchange="convert()" class="w-full bg-slate-900 border border-amber-500/50 rounded-xl px-3 py-2 text-sm text-amber-200 focus:outline-none">
          <option value="flour">面粉 (Flour - 1 Cup ≈ 125g)</option>
          <option value="sugar">白糖 (Sugar - 1 Cup ≈ 200g)</option>
          <option value="butter">牛油 (Butter - 1 Cup ≈ 227g)</option>
          <option value="honey">蜂蜜 (Honey - 1 Cup ≈ 340g)</option>
          <option value="water">水 / 牛奶 (Water/Milk - 1 Cup = 240g)</option>
        </select>
      </div>

        </div>
        <div>

        </div>
      </div>

    </div>

        'mpg_us': { zh: '英里/美加侖 (MPG US)', en: 'MPG (US)', toBase: x => x * 0.425144, fromBase: x => x / 0.425144 },
        'mpg_uk': { zh: '英里/英加侖 (MPG UK)', en: 'MPG (UK)', toBase: x => x * 0.354006, fromBase: x => x / 0.354006 }
      },
      angle: {
        'deg': { zh: '度 (Degree °)', en: 'Degree (°)', toBase: x => x, fromBase: x => x },
        'rad': { zh: '弧度 (Radian)', en: 'Radian (rad)', toBase: x => x * (180 / Math.PI), fromBase: x => x * (Math.PI / 180) },
        'grad': { zh: '百分度 (Gradian)', en: 'Gradian (grad)', toBase: x => x * 0.9, fromBase: x => x / 0.9 },
        'arcmin': { zh: '角分 (Arcminute \')', en: 'Arcminute (\')', toBase: x => x / 60, fromBase: x => x * 60 },
        'arcsec': { zh: '角秒 (Arcsecond \")', en: 'Arcsecond (\")', toBase: x => x / 3600, fromBase: x => x * 3600 }
      },
      force: {
        'N': { zh: '牛頓 (Newton N)', en: 'Newton (N)', toBase: x => x, fromBase: x => x },
        'kgf': { zh: '公斤力 (kgf)', en: 'Kilogram-force (kgf)', toBase: x => x * 9.80665, fromBase: x => x / 9.80665 },
        'lbf': { zh: '磅力 (lbf)', en: 'Pound-force (lbf)', toBase: x => x * 4.448222, fromBase: x => x / 4.448222 }
      },
      torque: {
        'Nm': { zh: '牛頓米 (N·m)', en: 'Newton-meter (Nm)', toBase: x => x, fromBase: x => x },
        'kgm': { zh: '公斤米 (kg-m)', en: 'Kilogram-meter (kg-m)', toBase: x => x * 9.80665, fromBase: x => x / 9.80665 },
        'lbft': { zh: '磅呎 (lb-ft)', en: 'Pound-foot (lb-ft)', toBase: x => x * 1.355818, fromBase: x => x / 1.355818 }
      }
    };

    window.toggleLanguage = function() {
      lang = lang === 'zh' ? 'en' : 'zh';
      document.getElementById('langBtnText').innerText = lang === 'zh' ? 'EN' : '中文';
      updateUIStrings();
      populateSelects();
      convert();
    };

    window.switchTab = function(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('tab-active'));
      document.getElementById(`tab-${tab}`).classList.add('tab-active');
      document.getElementById('bakingSelectorGroup').className = tab === 'baking' ? 'block' : 'hidden';
      populateSelects();
      convert();
    };

    function updateUIStrings() {
      const t = i18n[lang];
      document.getElementById('t-subtitle').innerText = t.subtitle;
      document.getElementById('t-inputLabel').innerText = t.inputLabel;
      document.getElementById('t-fromLabel').innerText = t.fromLabel;
      document.getElementById('t-toLabel').innerText = t.toLabel;
      document.getElementById('t-resultLabel').innerText = t.resultLabel;
      document.getElementById('copyBtnText').innerText = t.copyBtn;

      Object.keys(t.tabs).forEach(key => {
        const el = document.getElementById(`tab-${key}`);
        if(el) el.innerText = t.tabs[key];
      });
    }

    function populateSelects() {
      const fromSelect = document.getElementById('fromUnit');
      const toSelect = document.getElementById('toUnit');
      fromSelect.innerHTML = '';
      toSelect.innerHTML = '';

      const currentUnits = units[currentTab];
      Object.keys(currentUnits).forEach(key => {
        const label = currentUnits[key][lang];
        fromSelect.add(new Option(label, key));
        toSelect.add(new Option(label, key));
      });

      if (Object.keys(currentUnits).length > 1) toSelect.selectedIndex = 1;
    }

    window.convert = function() {
      const val = parseFloat(document.getElementById('inputValue').value);
      const from = document.getElementById('fromUnit').value;
      const to = document.getElementById('toUnit').value;
      const extraInfo = document.getElementById('extraInfo');
      const resultEl = document.getElementById('result');

      if (isNaN(val) || !from || !to) {
        resultEl.innerText = '---';
        extraInfo.innerText = '';
        return;
      }

      let res = 0;

      if (currentTab === 'fx') {
        const hkdBase = from === 'HKD' ? val : val / (globalRates[from] || 1);
        res = to === 'HKD' ? hkdBase : hkdBase * (globalRates[to] || 1);
        extraInfo.innerText = lang === 'zh' ? '💡 數據即時對接 Frankfurter 全球匯率 API' : '💡 Live data via Frankfurter FX API';
      }
      else if (currentTab === 'gold') {
        const usdToHkdRate = 7.82;
        const taelPerOz = 0.8294;
        if (from === 'oz_t' && to === 'tael_hk') {
          res = (val * liveGoldUsdOz * usdToHkdRate) / taelPerOz;
        } else if (from === 'tael_hk' && to === 'oz_t') {
          res = (val * taelPerOz) / (liveGoldUsdOz * usdToHkdRate);
        } else {
          res = val;
        }
        extraInfo.innerText = lang === 'zh' ? `💡 當前國際即時黃金參考價: $${liveGoldUsdOz} USD/oz` : `💡 Live Spot Gold Reference: $${liveGoldUsdOz} USD/oz`;
      }
      else if (currentTab === 'baking') {
        const foodType = document.getElementById('foodType').value;
        const density = FOOD_DENSITY_MAP[foodType]?.densityGramsPerMl || 1.0;
        let volumeMl = from === 'cup' ? val * 240 : (from === 'g' ? val / density : val);
        res = to === 'cup' ? volumeMl / 240 : (to === 'g' ? volumeMl * density : volumeMl);
        extraInfo.innerText = lang === 'zh' ? '💡 USDA 權威食材物理密度資料庫計算' : '💡 Calculated via USDA Food Density DB';
      }
      else {
        const baseVal = units[currentTab][from].toBase(val);
        res = units[currentTab][to].fromBase(baseVal);

        if (currentTab === 'temp' && hkEnvData.temp !== null) {
          extraInfo.innerText = lang === 'zh' ? `🌡️ 天文台即時：${hkEnvData.temp}°C | 濕度: ${hkEnvData.humidity}%` : `🌡️ HK Observatory Live: ${hkEnvData.temp}°C | Humidity: ${hkEnvData.humidity}%`;
        } else {
          extraInfo.innerText = '';
        }
      }

      if (!isFinite(res)) {
        resultEl.innerText = '∞';
      } else {
        resultEl.innerText = Number.isInteger(res) ? res.toString() : res.toLocaleString(undefined, { maximumFractionDigits: 6 });
      }
    };

    window.copyResult = function() {
      const resText = document.getElementById('result').innerText;
      if (resText === '---') return;
      navigator.clipboard.writeText(resText).then(() => {
        const btnText = document.getElementById('copyBtnText');
        btnText.innerText = i18n[lang].copied;
        setTimeout(() => { btnText.innerText = i18n[lang].copyBtn; }, 2000);
      });
    };

    async function initApp() {
      updateUIStrings();
      populateSelects();
      convert();

      try {
        const loc = await fetchUserLocation();
        document.getElementById('userLocationText').innerText = `📍 Location: ${loc.countryName} (${loc.countryCode})`;

        const liveRates = await fetchGlobalRates('HKD');
        if (liveRates) globalRates = { 'HKD': 1, ...liveRates };

        liveGoldUsdOz = await fetchGoldPrice();
        hkEnvData = await fetchHKEnvironmentData();

        convert();
      } catch (err) {
        console.warn('API Background Load complete with fallbacks');
      }
    }

    initApp();
  </script>
</body>
</html>
