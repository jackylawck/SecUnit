<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>秒換 SecUnit - Instant Unit & API Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .tab-active { background-color: #2563eb !important; color: #ffffff !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6">

  <main class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-2xl my-auto">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-black bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-500 bg-clip-text text-transparent">
          秒換 SecUnit
        </h1>
        <p id="t-subtitle" class="text-xs text-slate-400 mt-0.5">零廣告 · 6 大外接 API 即時數據支持</p>
      </div>
      
      <button onclick="toggleLanguage()" class="text-xs font-mono bg-slate-700 hover:bg-slate-600 text-cyan-300 border border-cyan-500/30 px-3 py-1 rounded-full transition active:scale-95">
        🌐 <span id="langBtnText">EN</span>
      </button>
    </div>

    <!-- Navigation Tabs -->
    <div class="overflow-x-auto pb-2 mb-4 scrollbar-none">
      <div class="flex gap-1.5 bg-slate-900/50 p-1.5 rounded-xl border border-slate-700/50 text-center min-w-max">
        <button onclick="switchTab('weight')" id="tab-weight" class="tab-btn px-3 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition tab-active"></button>
        <button onclick="switchTab('fx')" id="tab-fx" class="tab-btn px-3 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition"></button>
        <button onclick="switchTab('gold')" id="tab-gold" class="tab-btn px-3 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition"></button>
        <button onclick="switchTab('baking')" id="tab-baking" class="tab-btn px-3 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition"></button>
        <button onclick="switchTab('length')" id="tab-length" class="tab-btn px-3 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition"></button>
        <button onclick="switchTab('area')" id="tab-area" class="tab-btn px-3 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition"></button>
        <button onclick="switchTab('temp')" id="tab-temp" class="tab-btn px-3 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition"></button>
        <button onclick="switchTab('data')" id="tab-data" class="tab-btn px-3 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition"></button>
      </div>
    </div>

    <!-- Conversion Form -->
    <div class="space-y-4">
      <div>
        <label id="t-inputLabel" class="block text-xs font-medium text-slate-400 mb-1">輸入數值</label>
        <input type="number" id="inputValue" value="1" step="any" oninput="convert()" 
               class="w-full bg-slate-900 border border-slate-700 focus:border-blue-500 rounded-xl px-4 py-3 text-2xl font-mono font-bold text-white focus:outline-none transition">
      </div>

      <!-- Baking Selector (Hidden by default) -->
      <div id="bakingSelectorGroup" class="hidden">
        <label class="block text-xs font-medium text-amber-400 mb-1">選擇食材類型 (食材密度專用)</label>
        <select id="foodType" onchange="convert()" class="w-full bg-slate-900 border border-amber-500/50 rounded-xl px-3 py-2 text-sm text-amber-200 focus:outline-none">
          <option value="flour">面粉 (Flour - 1 Cup ≈ 125g)</option>
          <option value="sugar">白糖 (Sugar - 1 Cup ≈ 200g)</option>
          <option value="butter">牛油 (Butter - 1 Cup ≈ 227g)</option>
          <option value="honey">蜂蜜 (Honey - 1 Cup ≈ 340g)</option>
          <option value="water">水 / 牛奶 (Water/Milk - 1 Cup = 240g)</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label id="t-fromLabel" class="block text-xs font-medium text-slate-400 mb-1">由 (From)</label>
          <select id="fromUnit" onchange="convert()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition"></select>
        </div>
        <div>
          <label id="t-toLabel" class="block text-xs font-medium text-slate-400 mb-1">轉至 (To)</label>
          <select id="toUnit" onchange="convert()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition"></select>
        </div>
      </div>

      <!-- Result Card -->
      <div class="bg-gradient-to-br from-slate-900 to-slate-900/80 border border-slate-700/80 rounded-2xl p-5 mt-6 text-center relative group">
        <div id="t-resultLabel" class="text-xs text-slate-400 font-medium mb-1">轉換結果</div>
        <div id="result" class="text-3xl sm:text-4xl font-extrabold font-mono text-cyan-400 tracking-tight break-all">---</div>
        <div id="extraInfo" class="text-xs text-slate-400 mt-2 font-light min-h-[1.25rem]"></div>

        <button onclick="copyResult()" class="mt-3 inline-flex items-center gap-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 px-3 py-1 rounded-lg transition active:scale-95">
          <span id="copyBtnText">📋 複製結果</span>
        </button>
      </div>
    </div>
  </main>

  <footer class="mt-6 text-center text-xs text-slate-500 space-y-1">
    <p>SecUnit &copy; 2026 | Pure & Ad-free · Multi-API Powered</p>
    <p id="userLocationText" class="text-slate-600">偵測定位中...</p>
  </footer>

  <script type="module">
    import { 
      fetchGlobalRates, 
      fetchHKEnvironmentData, 
      fetchGoldPrice, 
      fetchUserLocation, 
      FOOD_DENSITY_MAP 
    } from './api.js';

    let lang = 'zh';
    let currentTab = 'weight';

    let globalRates = {
      'HKD': 1, 'USD': 0.128, 'JPY': 19.2, 'EUR': 0.118, 'GBP': 0.101, 'TWD': 4.15, 'CNY': 0.92,
      'KRW': 172.5, 'THB': 4.52, 'SGD': 0.171, 'MYR': 0.57, 'VND': 3180.0, 'IDR': 2050.0,
      'PHP': 7.35, 'INR': 10.7, 'AUD': 0.192, 'CAD': 0.175, 'NZD': 0.21, 'CHF': 0.112,
      'SEK': 1.35, 'NOK': 1.38, 'DKK': 0.88, 'AED': 0.47, 'TRY': 4.25, 'BRL': 0.71,
      'MXN': 2.38, 'ZAR': 2.32
    };
    let liveGoldUsdOz = 2350.0;
    let hkEnvData = { temp: null, humidity: null };

    const i18n = {
      zh: {
        subtitle: '零廣告 · 6 大外接 API 即時數據支持',
        inputLabel: '輸入數值',
        fromLabel: '由 (From)',
        toLabel: '轉至 (To)',
        resultLabel: '轉換結果',
        copyBtn: '📋 複製結果',
        copied: '✅ 已複製！',
        tabs: { weight: '重量', fx: '全球匯率', gold: '即時金價', baking: '烘焙食材', length: '長度', area: '面積', temp: '溫度', data: '數據/網速' }
      },
      en: {
        subtitle: 'Ad-free · Powered by 6 Live Open APIs',
        inputLabel: 'Value',
        fromLabel: 'From',
        toLabel: 'To',
        resultLabel: 'Result',
        copyBtn: '📋 Copy Result',
        copied: '✅ Copied!',
        tabs: { weight: 'Weight', fx: 'Forex API', gold: 'Live Gold', baking: 'Baking', length: 'Length', area: 'Area', temp: 'Temp', data: 'Data' }
      }
    };

    const units = {
      weight: {
        'lbs': { zh: '磅 (lbs)', en: 'Pounds (lbs)', toBase: x => x * 0.45359237, fromBase: x => x / 0.45359237 },
        'kg': { zh: '公斤 (kg)', en: 'Kilograms (kg)', toBase: x => x, fromBase: x => x },
        'g': { zh: '克 (g)', en: 'Grams (g)', toBase: x => x / 1000, fromBase: x => x * 1000 },
        'catty_hk': { zh: '香港斤 (司馬斤)', en: 'HK Catty', toBase: x => x * 0.60478982, fromBase: x => x / 0.60478982 }
      },
      fx: {
        'HKD': { zh: '港元 (HKD)', en: 'HKD' },
        'USD': { zh: '美元 (USD)', en: 'USD' },
        'JPY': { zh: '日圓 (JPY)', en: 'JPY' },
        'EUR': { zh: '歐元 (EUR)', en: 'EUR' },
        'GBP': { zh: '英鎊 (GBP)', en: 'GBP' },
        'TWD': { zh: '新台幣 (TWD)', en: 'TWD' },
        'CNY': { zh: '人民幣 (CNY)', en: 'CNY' },
        'KRW': { zh: '韓圓 (KRW)', en: 'KRW' },
        'THB': { zh: '泰銖 (THB)', en: 'THB' },
        'SGD': { zh: '新加坡元 (SGD)', en: 'SGD' },
        'MYR': { zh: '馬來西亞文吉 (MYR)', en: 'MYR' },
        'VND': { zh: '越南盾 (VND)', en: 'VND' },
        'IDR': { zh: '印尼盾 (IDR)', en: 'IDR' },
        'PHP': { zh: '菲律賓比索 (PHP)', en: 'PHP' },
        'INR': { zh: '印度盧比 (INR)', en: 'INR' },
        'AUD': { zh: '澳元 (AUD)', en: 'AUD' },
        'CAD': { zh: '加元 (CAD)', en: 'CAD' },
        'NZD': { zh: '紐西蘭元 (NZD)', en: 'NZD' },
        'CHF': { zh: '瑞士法郎 (CHF)', en: 'CHF' },
        'SEK': { zh: '瑞典克朗 (SEK)', en: 'SEK' },
        'NOK': { zh: '挪威克朗 (NOK)', en: 'NOK' },
        'DKK': { zh: '丹麥克朗 (DKK)', en: 'DKK' },
        'AED': { zh: '阿聯酋迪拉姆 (AED)', en: 'AED' },
        'TRY': { zh: '土耳其里拉 (TRY)', en: 'TRY' },
        'BRL': { zh: '巴西雷亞爾 (BRL)', en: 'BRL' },
        'MXN': { zh: '墨西哥比索 (MXN)', en: 'MXN' },
        'ZAR': { zh: '南非蘭特 (ZAR)', en: 'ZAR' }
      },
      gold: {
        'oz_t': { zh: '國際金衡盎司 (USD oz t)', en: 'Gold Troy Oz (USD)' },
        'tael_hk': { zh: '香港金行兩 (HKD 兩)', en: 'HK Gold Tael (HKD)' }
      },
      baking: {
        'cup': { zh: '美制杯 (Cup)', en: 'US Cups' },
        'ml': { zh: '毫升 (mL)', en: 'Milliliters' },
        'g': { zh: '克 (g)', en: 'Grams' }
      },
      length: {
        'm': { zh: '米 (m)', en: 'Meters', toBase: x => x, fromBase: x => x },
        'cm': { zh: '厘米 (cm)', en: 'Centimeters', toBase: x => x / 100, fromBase: x => x * 100 },
        'ft': { zh: '呎 (ft)', en: 'Feet', toBase: x => x * 0.3048, fromBase: x => x / 0.3048 }
      },
      area: {
        'sqft': { zh: '平方呎 (sq ft)', en: 'Sq Feet', toBase: x => x * 0.09290304, fromBase: x => x / 0.09290304 },
        'sqm': { zh: '平方米 (sq m)', en: 'Sq Meters', toBase: x => x, fromBase: x => x }
      },
      temp: {
        'C': { zh: '攝氏 (°C)', en: 'Celsius (°C)', toBase: x => x, fromBase: x => x },
        'F': { zh: '華氏 (°F)', en: 'Fahrenheit (°F)', toBase: x => (x - 32) * 5/9, fromBase: x => (x * 9/5) + 32 }
      },
      data: {
        'MB': { zh: 'Megabytes (MB)', en: 'MB', toBase: x => x, fromBase: x => x },
        'GB': { zh: 'Gigabytes (GB)', en: 'GB', toBase: x => x * 1024, fromBase: x => x / 1024 }
      }
    };

    window.toggleLanguage = function() {
      lang = lang === 'zh' ? 'en' : 'zh';
      document.getElementById('langBtnText').innerText = lang === 'zh' ? 'EN' : '中文';
      updateUIStrings();
      populateSelects();
      convert();
    };

    window.switchTab = function(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('tab-active'));
      document.getElementById(`tab-${tab}`).classList.add('tab-active');
      document.getElementById('bakingSelectorGroup').className = tab === 'baking' ? 'block' : 'hidden';
      populateSelects();
      convert();
    };

    function updateUIStrings() {
      const t = i18n[lang];
      document.getElementById('t-subtitle').innerText = t.subtitle;
      document.getElementById('t-inputLabel').innerText = t.inputLabel;
      document.getElementById('t-fromLabel').innerText = t.fromLabel;
      document.getElementById('t-toLabel').innerText = t.toLabel;
      document.getElementById('t-resultLabel').innerText = t.resultLabel;
      document.getElementById('copyBtnText').innerText = t.copyBtn;

      Object.keys(t.tabs).forEach(key => {
        document.getElementById(`tab-${key}`).innerText = t.tabs[key];
      });
    }

    function populateSelects() {
      const fromSelect = document.getElementById('fromUnit');
      const toSelect = document.getElementById('toUnit');
      fromSelect.innerHTML = '';
      toSelect.innerHTML = '';

      const currentUnits = units[currentTab];
      Object.keys(currentUnits).forEach(key => {
        const label = currentUnits[key][lang];
        fromSelect.add(new Option(label, key));
        toSelect.add(new Option(label, key));
      });

      if (Object.keys(currentUnits).length > 1) toSelect.selectedIndex = 1;
    }

    window.convert = function() {
      const val = parseFloat(document.getElementById('inputValue').value);
      const from = document.getElementById('fromUnit').value;
      const to = document.getElementById('toUnit').value;
      const extraInfo = document.getElementById('extraInfo');
      const resultEl = document.getElementById('result');

      if (isNaN(val) || !from || !to) {
        resultEl.innerText = '---';
        extraInfo.innerText = '';
        return;
      }

      let res = 0;

      if (currentTab === 'fx') {
        const hkdBase = from === 'HKD' ? val : val / (globalRates[from] || 1);
        res = to === 'HKD' ? hkdBase : hkdBase * (globalRates[to] || 1);
        extraInfo.innerText = '💡 數據即時對接 Frankfurter 全球 30+ 國匯率 API';
      }
      else if (currentTab === 'gold') {
        const usdToHkdRate = 7.82;
        const taelPerOz = 0.8294;
        if (from === 'oz_t' && to === 'tael_hk') {
          res = (val * liveGoldUsdOz * usdToHkdRate) / taelPerOz;
        } else if (from === 'tael_hk' && to === 'oz_t') {
          res = (val * taelPerOz) / (liveGoldUsdOz * usdToHkdRate);
        } else {
          res = val;
        }
        extraInfo.innerText = `💡 當前國際即時黃金參考價: $${liveGoldUsdOz} USD/oz`;
      }
      else if (currentTab === 'baking') {
        const foodType = document.getElementById('foodType').value;
        const density = FOOD_DENSITY_MAP[foodType]?.densityGramsPerMl || 1.0;
        let volumeMl = from === 'cup' ? val * 240 : (from === 'g' ? val / density : val);
        res = to === 'cup' ? volumeMl / 240 : (to === 'g' ? volumeMl * density : volumeMl);
        extraInfo.innerText = '💡 USDA 權威食材物理密度資料庫計算';
      }
      else {
        const baseVal = units[currentTab][from].toBase(val);
        res = units[currentTab][to].fromBase(baseVal);

        if (currentTab === 'temp' && hkEnvData.temp !== null) {
          extraInfo.innerText = `🌡️ 天文台即時：${hkEnvData.temp}°C | 濕度: ${hkEnvData.humidity}%`;
        } else {
          extraInfo.innerText = '';
        }
      }

      resultEl.innerText = Number.isInteger(res) ? res.toString() : res.toLocaleString(undefined, { maximumFractionDigits: 4 });
    };

    window.copyResult = function() {
      const resText = document.getElementById('result').innerText;
      if (resText === '---') return;
      navigator.clipboard.writeText(resText).then(() => {
        const btnText = document.getElementById('copyBtnText');
        btnText.innerText = i18n[lang].copied;
        setTimeout(() => { btnText.innerText = i18n[lang].copyBtn; }, 2000);
      });
    };

    async function initApp() {
      updateUIStrings();
      populateSelects();
      convert();

      try {
        const loc = await fetchUserLocation();
        document.getElementById('userLocationText').innerText = `📍 當前訪問地區: ${loc.countryName} (${loc.countryCode})`;

        const liveRates = await fetchGlobalRates('HKD');
        if (liveRates) globalRates = { 'HKD': 1, ...liveRates };

        liveGoldUsdOz = await fetchGoldPrice();
        hkEnvData = await fetchHKEnvironmentData();

        convert();
      } catch (err) {
        console.warn('API Background Load complete with fallbacks');
      }
    }

    initApp();
  </script>
</body>
</html>
