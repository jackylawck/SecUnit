  <script>
    async function fetchGlobalRates(baseCurrency = 'HKD') {
      try {
        const res = await fetch(`https://api.frankfurter.app/latest?from=${baseCurrency}`);
        const data = await res.json();
        return data.rates || {};
      } catch (err) {
        return { USD: 0.128, JPY: 19.2, EUR: 0.118, GBP: 0.101, TWD: 4.15, CNY: 0.92, AUD: 0.192, CAD: 0.175 };
      }
    }

    async function fetchHKEnvironmentData() {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data = await res.json();
        return { temp: data.temperature?.data?.[0]?.value || null, humidity: data.humidity?.data?.[0]?.value || null };
      } catch (err) { return { temp: null, humidity: null }; }
    }

    async function fetchGoldPrice() {
      try {
        const res = await fetch('https://api.metals.dev/v1/latest?api_key=demo&currency=USD&unit=toz');
        const data = await res.json();
        return data.metals?.gold || 2350.0;
      } catch (err) { return 2350.0; }
    }

    async function fetchUserLocation() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        return { countryCode: data.country_code, countryName: data.country_name };
      } catch (err) { return { countryCode: 'HK', countryName: 'Hong Kong' }; }
    }

    async function fetchCryptoPrices() {
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd');
        const data = await res.json();
        return { btc_usd: data.bitcoin?.usd || 65000, eth_usd: data.ethereum?.usd || 3500 };
      } catch (err) { return { btc_usd: 65000, eth_usd: 3500 }; }
    }

    async function fetchAirQuality(lat = 22.3193, lon = 114.1694) {
      try {
        const res = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi,pm2_5`);
        const data = await res.json();
        return { aqi: data.current?.us_aqi || '--', pm25: data.current?.pm2_5 || '--' };
      } catch (err) { return { aqi: '--', pm25: '--' }; }
    }

    async function fetchWorldTime(timezoneString) {
      if (timezoneString === 'UTC') timezoneString = 'Etc/UTC';
      try {
        const res = await fetch(`http://worldtimeapi.org/api/timezone/${timezoneString}`);
        const data = await res.json();
        return data.datetime; 
      } catch (err) { return null; }
    }

    async function fetchCountryInfo(currencyCode) {
      if (['BTC', 'ETH', 'HKD'].includes(currencyCode)) return null;
      try {
        const res = await fetch(`https://restcountries.com/v3.1/currency/${currencyCode.toLowerCase()}`);
        const data = await res.json();
        if (data && data.length > 0) {
          const mainCountry = data.sort((a, b) => b.population - a.population)[0];
          return { flag: mainCountry.flag, name: mainCountry.name.common, capital: mainCountry.capital?.[0] || 'N/A', pop: (mainCountry.population / 1000000).toFixed(1) + 'M' };
        }
        return null;
      } catch (err) { return null; }
    }

      volume: { 'L': { zh: '升 (L)', en: 'Liters', toBase: x => x, fromBase: x => x }, 'mL': { zh: '毫升 (mL)', en: 'Milliliters', toBase: x => x / 1000, fromBase: x => x * 1000 } },
      speed: { 'kmh': { zh: '公里/小時 (km/h)', en: 'km/h', toBase: x => x / 3.6, fromBase: x => x * 3.6 }, 'mph': { zh: '英里/小時 (mph)', en: 'mph', toBase: x => x * 0.44704, fromBase: x => x / 0.44704 } },
      time: { 'min': { zh: '分鐘 (min)', en: 'Minutes', toBase: x => x * 60, fromBase: x => x / 60 }, 'hr': { zh: '小時 (hr)', en: 'Hours', toBase: x => x * 3600, fromBase: x => x / 3600 } },
      data: { 'MB': { zh: 'MB', en: 'MB', toBase: x => x, fromBase: x => x }, 'GB': { zh: 'GB', en: 'GB', toBase: x => x * 1024, fromBase: x => x / 1024 } },
      energy: { 'kcal': { zh: '千卡 (kcal)', en: 'kcal', toBase: x => x, fromBase: x => x }, 'kJ': { zh: '千焦 (kJ)', en: 'kJ', toBase: x => x / 4.184, fromBase: x => x * 4.184 } },
      pressure: { 'hPa': { zh: '百帕 (hPa)', en: 'hPa', toBase: x => x * 100, fromBase: x => x / 100 }, 'psi': { zh: 'PSI', en: 'PSI', toBase: x => x * 6894.76, fromBase: x => x / 6894.76 } },
      power: { 'W': { zh: '瓦特 (W)', en: 'Watt', toBase: x => x, fromBase: x => x }, 'hp': { zh: '馬力 (hp)', en: 'hp', toBase: x => x * 745.7, fromBase: x => x / 745.7 } },
      fuel: { 'kmL': { zh: 'km/L', en: 'km/L', toBase: x => x, fromBase: x => x }, 'L100km': { zh: 'L/100km', en: 'L/100km', toBase: x => x === 0 ? 0 : 100 / x, fromBase: x => x === 0 ? 0 : 100 / x } },
      baking: { 'cup': { zh: '美制杯', en: 'US Cups' }, 'g': { zh: '克', en: 'Grams' } },
      angle: { 'deg': { zh: '度 (°)', en: 'Degree', toBase: x => x, fromBase: x => x }, 'rad': { zh: '弧度 (rad)', en: 'Radian', toBase: x => x * (180 / Math.PI), fromBase: x => x * (Math.PI / 180) } },
      force: { 'N': { zh: '牛頓 (N)', en: 'Newton', toBase: x => x, fromBase: x => x }, 'kgf': { zh: '公斤力 (kgf)', en: 'kgf', toBase: x => x * 9.80665, fromBase: x => x / 9.80665 } },
      torque: { 'Nm': { zh: '牛頓米 (Nm)', en: 'Nm', toBase: x => x, fromBase: x => x }, 'kgm': { zh: '公斤米 (kg-m)', en: 'kg-m', toBase: x => x * 9.80665, fromBase: x => x / 9.80665 } }
    };

    function toggleLanguage() {
      lang = lang === 'zh' ? 'en' : 'zh';
      document.getElementById('langBtnText').innerText = lang === 'zh' ? 'EN' : '中文';
      updateUIStrings();
      populateSelects();
      convert();
    }

    function toggleRareUnits() {
      showRare = !showRare;
      const t = i18n[lang];
      document.getElementById('t-rareToggle').innerText = showRare ? t.rareOn : t.rareOff;
      document.getElementById('rareToggleIcon').innerText = showRare ? '🙈' : '👀';
      
      const fromEl = document.getElementById('fromUnit');
      const toEl = document.getElementById('toUnit');
      const oldFrom = fromEl.value;
      const oldTo = toEl.value;
      
      populateSelects();

      if (Array.from(fromEl.options).some(opt => opt.value === oldFrom)) fromEl.value = oldFrom;
      if (Array.from(toEl.options).some(opt => opt.value === oldTo)) toEl.value = oldTo;
      
      fromEl.classList.remove('flash-update');
      toEl.classList.remove('flash-update');
      void fromEl.offsetWidth;
      fromEl.classList.add('flash-update');
      toEl.classList.add('flash-update');
      convert();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('tab-active'));
      document.getElementById(`tab-${tab}`).classList.add('tab-active');
      document.getElementById('bakingSelectorGroup').className = tab === 'baking' ? 'block' : 'hidden';
      populateSelects();
      convert();
    }

    function updateUIStrings() {
      const t = i18n[lang];
      document.getElementById('t-subtitle').innerText = t.subtitle;
      document.getElementById('t-inputLabel').innerText = t.inputLabel;
      document.getElementById('t-fromLabel').innerText = t.fromLabel;
      document.getElementById('t-toLabel').innerText = t.toLabel;
      document.getElementById('t-resultLabel').innerText = t.resultLabel;
      document.getElementById('copyBtnText').innerText = t.copyBtn;
      document.getElementById('t-rareToggle').innerText = showRare ? t.rareOn : t.rareOff;

      Object.keys(t.tabs).forEach(key => {
        const el = document.getElementById(`tab-${key}`);
        if(el) el.innerText = t.tabs[key];
      });
    }

    function populateSelects() {
      const fromSelect = document.getElementById('fromUnit');
      const toSelect = document.getElementById('toUnit');
      fromSelect.innerHTML = '';
      toSelect.innerHTML = '';

      const currentUnits = units[currentTab];
      Object.keys(currentUnits).forEach(key => {
        if (currentUnits[key].rare && !showRare) return;
        const label = currentUnits[key][lang];
        fromSelect.add(new Option(label, key));
        toSelect.add(new Option(label, key));
      });
      if (fromSelect.options.length > 1) toSelect.selectedIndex = 1;
    }

    async function convert() {
      const val = parseFloat(document.getElementById('inputValue').value);
      const from = document.getElementById('fromUnit').value;
      const to = document.getElementById('toUnit').value;
      const extraInfo = document.getElementById('extraInfo');
      const resultEl = document.getElementById('result');

      if (isNaN(val) || !from || !to) {
        resultEl.innerText = '---';
        extraInfo.innerText = '';
        return;
      }

      let res = 0;
      extraInfo.innerHTML = '';

      if (currentTab === 'fx') {
        const hkdBase = from === 'HKD' ? val : val / (globalRates[from] || 1);
        res = to === 'HKD' ? hkdBase : hkdBase * (globalRates[to] || 1);
        extraInfo.innerHTML = lang === 'zh' ? '💡 數據由 Frankfurter & CoinGecko 提供' : '💡 Data via Frankfurter & CoinGecko';
        
        if (!countryCache[to] && !['BTC', 'ETH', 'HKD'].includes(to)) {
           const cInfo = await fetchCountryInfo(to);
           if (cInfo) countryCache[to] = cInfo;
        }
        if (countryCache[to]) {
           const c = countryCache[to];
           extraInfo.innerHTML += `<br>🌍 國家: ${c.flag} ${c.name} | 首都: ${c.capital} | 人口: ${c.pop}`;
        }
      }
      else if (currentTab === 'timezone') {
        const baseVal = units[currentTab][from].toBase(val);
        res = units[currentTab][to].fromBase(baseVal);
        
        let hrs = Math.floor(res);
        let mins = Math.round((res - hrs) * 60);
        if (mins === 60) { hrs = (hrs + 1) % 24; mins = 0; }
        resultEl.innerText = `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
        
        extraInfo.innerHTML = `<span class="text-cyan-400 animate-pulse">連線中... Fetching Live Time...</span>`;
        const liveTime = await fetchWorldTime(to);
        if (liveTime) {
            const formatted = liveTime.substring(0, 19).replace('T', ' ');
            extraInfo.innerHTML = `📡 系統即時同步 System Live Time:<br><strong class="text-white">${formatted}</strong>`;
        } else {
            extraInfo.innerHTML = `📡 無法獲取即時系統時間 API Offline`;
        }
        return; 
      }
      else if (currentTab === 'gold') {
        const usdToHkdRate = globalRates['USD'] ? (1 / globalRates['USD']) : 7.82;
        const taelPerOz = 0.8294;
        if (from === 'oz_t' && to === 'tael_hk') res = (val * liveGoldUsdOz * usdToHkdRate) / taelPerOz;
        else if (from === 'tael_hk' && to === 'oz_t') res = (val * taelPerOz) / (liveGoldUsdOz * usdToHkdRate);
        else res = val;
        extraInfo.innerText = lang === 'zh' ? `💡 國際即時黃金參考價: $${liveGoldUsdOz} USD/oz` : `💡 Live Spot Gold: $${liveGoldUsdOz} USD/oz`;
      }
      else if (currentTab === 'temp') {
        const baseVal = units[currentTab][from].toBase(val);
        res = units[currentTab][to].fromBase(baseVal);
        extraInfo.innerHTML = lang === 'zh' 
          ? `🌡️ 港天文台: ${hkEnvData.temp}°C | 濕度: ${hkEnvData.humidity}%<br>💨 實時空氣質素 (AQI): <strong class="text-amber-400">${hkEnvData.aqi}</strong> | PM2.5: ${hkEnvData.pm25}`
          : `🌡️ HKO: ${hkEnvData.temp}°C | Humidity: ${hkEnvData.humidity}%<br>💨 Live AQI: <strong class="text-amber-400">${hkEnvData.aqi}</strong> | PM2.5: ${hkEnvData.pm25}`;
      }
      else if (currentTab === 'baking') {
        const foodType = document.getElementById('foodType').value;
        const density = FOOD_DENSITY_MAP[foodType]?.densityGramsPerMl || 1.0;
        let volumeMl = from === 'cup' ? val * 240 : (from === 'g' ? val / density : val);
        res = to === 'cup' ? volumeMl / 240 : (to === 'g' ? volumeMl * density : volumeMl);
      }
      else {
        const baseVal = units[currentTab][from].toBase(val);
        res = units[currentTab][to].fromBase(baseVal);
      }

      if (!isFinite(res)) {
        resultEl.innerText = '∞';
      } else {
        if (Math.abs(res) < 0.0001 && res !== 0) resultEl.innerText = res.toExponential(4);
        else if (Math.abs(res) > 1e10) resultEl.innerText = res.toExponential(4);
        else resultEl.innerText = Number.isInteger(res) ? res.toString() : res.toLocaleString(undefined, { maximumFractionDigits: 4 });
      }
    }

    function copyResult() {
      const resText = document.getElementById('result').innerText;
      if (resText === '---') return;
      navigator.clipboard.writeText(resText).then(() => {
        const btnText = document.getElementById('copyBtnText');
        btnText.innerText = i18n[lang].copied;
        setTimeout(() => { btnText.innerText = i18n[lang].copyBtn; }, 2000);
      });
    }

    async function initApp() {
      updateUIStrings();
      populateSelects();
      convert();

      try {
        const loc = await fetchUserLocation();
        document.getElementById('userLocationText').innerText = `📍 Location: ${loc.countryName} (${loc.countryCode})`;

        const [rates, hko, gold, crypto, aqi] = await Promise.all([
          fetchGlobalRates('HKD'),
          fetchHKEnvironmentData(),
          fetchGoldPrice(),
          fetchCryptoPrices(),
          fetchAirQuality()
        ]);

        if (rates) globalRates = { 'HKD': 1, ...rates };
        if (crypto && globalRates['USD']) {
           globalRates['BTC'] = 1 / (crypto.btc_usd * (1/globalRates['USD']));
           globalRates['ETH'] = 1 / (crypto.eth_usd * (1/globalRates['USD']));
        }
        
        liveGoldUsdOz = gold;
        hkEnvData = { ...hko, ...aqi };
        convert();
      } catch (err) {
        console.warn('API Load warning, running on defaults.');
      }
    }

    window.toggleLanguage = toggleLanguage;
    window.toggleRareUnits = toggleRareUnits;
    window.switchTab = switchTab;
    window.convert = convert;
    window.copyResult = copyResult;

    initApp();
  </script>
</body>
</html>
